<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="oled">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{ title }}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root[data-theme="oled"] {
            --bg-color: #000000;
            --surface-card: #121212;
            --text-primary: #d1d5db;
            --text-heading: #f9fafb;
            --border-line: #1f2937;
            --brand-accent: #f59e0b;
            --dialogue-text: #ffffff;
            --nav-translucent: rgba(0, 0, 0, 0.94);
        }

        :root[data-theme="dark"] {
            --bg-color: #18191a;
            --surface-card: #242526;
            --text-primary: #b0b3b8;
            --text-heading: #e4e6eb;
            --border-line: #3a3b3c;
            --brand-accent: #eab308;
            --dialogue-text: #f3f4f6;
            --nav-translucent: rgba(24, 25, 26, 0.95);
        }

        :root[data-theme="light"] {
            --bg-color: #fdfbf7;
            --surface-card: #f3ede2;
            --text-primary: #2d2621;
            --text-heading: #120e0c;
            --border-line: #e4dbcc;
            --brand-accent: #d97706;
            --dialogue-text: #000000;
            --nav-translucent: rgba(253, 251, 247, 0.96);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            font-size: 19px;
            line-height: 2.2;
            letter-spacing: 0.15px;
            word-wrap: break-word;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        body {
            padding: 16px 20px 140px 20px;
        }

        .top-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 720px;
            margin: 0 auto 20px auto;
        }

        .action-button {
            background-color: var(--surface-card);
            border: 1px solid var(--border-line);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.15s ease;
        }

        .action-button:active {
            opacity: 0.7;
        }

        .chapter-header {
            text-align: center;
            padding-bottom: 22px;
            border-bottom: 1px solid var(--border-line);
            margin-bottom: 30px;
            max-width: 720px;
            margin-left: auto;
            margin-right: auto;
        }

        .novel-tag {
            font-size: 13px;
            color: var(--brand-accent);
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.2px;
        }

        h1 {
            font-size: 22px;
            color: var(--text-heading);
            font-weight: 800;
            line-height: 1.5;
        }

        .reading-area {
            max-width: 720px;
            margin: 0 auto;
        }

        .reading-area p {
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
            color: var(--text-primary);
            margin-bottom: 24px;
            text-align: justify;
            text-justify: inter-word;
        }

        .reading-area p.dialogue {
            color: var(--dialogue-text);
            font-weight: 600;
            padding-right: 14px;
            border-right: 3px solid var(--brand-accent);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--nav-translucent);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-top: 1px solid var(--border-line);
            padding: 12px 18px env(safe-area-inset-bottom, 12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            z-index: 1000;
        }

        .nav-btn {
            background-color: var(--surface-card);
            color: var(--text-heading);
            border: 1px solid var(--border-line);
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .nav-btn.disabled {
            opacity: 0.25;
            pointer-events: none;
        }

        .nav-select {
            background-color: var(--surface-card);
            color: var(--text-heading);
            border: 1px solid var(--border-line);
            padding: 10px 10px;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            flex-grow: 1;
            text-align: center;
            outline: none;
            font-weight: 600;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.65);
            display: none;
            z-index: 2000;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .settings-card {
            background-color: var(--surface-card);
            border-top: 1px solid var(--border-line);
            width: 100%;
            max-width: 550px;
            padding: 24px 22px calc(24px + env(safe-area-inset-bottom, 0px)) 22px;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
            animation: modalSlideUp 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalSlideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .setting-section {
            margin-bottom: 20px;
        }

        .setting-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-heading);
            margin-bottom: 10px;
            display: block;
        }

        .options-grid {
            display: grid;
            gap: 8px;
        }

        .options-grid.themes {
            grid-template-columns: repeat(3, 1fr);
        }

        .options-grid.fonts {
            grid-template-columns: repeat(2, 1fr);
        }

        .option-button {
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            border: 1px solid var(--border-line);
            font-size: 14px;
            color: var(--text-heading);
            background: transparent;
            font-family: inherit;
        }

        .option-button.active {
            border-color: var(--brand-accent);
            color: var(--brand-accent);
            font-weight: 700;
            background-color: rgba(245, 158, 11, 0.08);
        }

        .font-slider-bar {
            width: 100%;
            height: 6px;
            accent-color: var(--brand-accent);
            margin-top: 8px;
        }

        .close-button {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="top-action-bar">
        <a href="/" class="action-button">📚 المكتبة</a>
        <button class="action-button" onclick="openSettingsModal(true)">⚙️ المظهر والخط</button>
    </div>

    <header class="chapter-header">
        <div class="novel-tag">{{ novel_title }}</div>
        <h1>{{ title }}</h1>
    </header>
    
    <main class="reading-area" id="reading-content">
        {{ body_paragraphs }}
    </main>

    <footer class="bottom-nav">
        <a href="/novel/{{ novel_id }}/chapter/{{ prev_ch }}" class="nav-btn {{ 'disabled' if not prev_ch else '' }}" id="prev-link">← السابق</a>
        <select class="nav-select" onchange="if(this.value) window.location.href='/novel/{{ novel_id }}/chapter/' + this.value">
            {{ dropdown_options }}
        </select>
        <a href="/novel/{{ novel_id }}/chapter/{{ next_ch }}" class="nav-btn {{ 'disabled' if not next_ch else '' }}" id="next-link">التالي →</a>
    </footer>

    <!-- Settings Sheet Modal -->
    <div class="modal-overlay" id="settings-sheet" onclick="handleOverlayTap(event)">
        <div class="settings-card" onclick="event.stopPropagation()">
            <div class="setting-section">
                <span class="setting-title">السمة واللون</span>
                <div class="options-grid themes">
                    <button class="option-button" onclick="applyTheme('oled')" id="btn-theme-oled">أسود OLED</button>
                    <button class="option-button" onclick="applyTheme('dark')" id="btn-theme-dark">داكن هادئ</button>
                    <button class="option-button" onclick="applyTheme('light')" id="btn-theme-light">نهاري مريح</button>
                </div>
            </div>

            <div class="setting-section">
                <span class="setting-title">نوع الخط العربي</span>
                <div class="options-grid fonts">
                    <button class="option-button" style="font-family:'Cairo'" onclick="applyFont('Cairo')" id="btn-font-Cairo">كايرو</button>
                    <button class="option-button" style="font-family:'Amiri'" onclick="applyFont('Amiri')" id="btn-font-Amiri">أميري (نسخي)</button>
                    <button class="option-button" style="font-family:'Tajawal'" onclick="applyFont('Tajawal')" id="btn-font-Tajawal">تجوال</button>
                    <button class="option-button" style="font-family:'Alexandria'" onclick="applyFont('Alexandria')" id="btn-font-Alexandria">الإسكندرية</button>
                </div>
            </div>

            <div class="setting-section">
                <span class="setting-title">حجم الخط (<span id="font-size-display">19px</span>)</span>
                <input type="range" class="font-slider-bar" min="15" max="30" value="19" id="slider-size" oninput="applyFontSize(this.value)">
            </div>
            
            <button class="nav-btn close-button" onclick="openSettingsModal(false)">إغلاق وتطبيق</button>
        </div>
    </div>

    <script>
        const NOVEL_ID = "{{ novel_id }}";
        const CHAPTER_NUM = "{{ chapter_num }}";

        function openSettingsModal(visible) {
            document.getElementById('settings-sheet').classList.toggle('active', visible);
        }

        function handleOverlayTap(e) {
            if (e.target.id === 'settings-sheet') {
                openSettingsModal(false);
            }
        }

        function applyTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('novel_theme', themeName);
            document.querySelectorAll('.options-grid.themes .option-button').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('btn-theme-' + themeName);
            if (activeBtn) activeBtn.classList.add('active');
        }

        function applyFont(fontName) {
            document.body.style.fontFamily = `'${fontName}', system-ui, sans-serif`;
            localStorage.setItem('novel_font', fontName);
            document.querySelectorAll('.options-grid.fonts .option-button').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('btn-font-' + fontName);
            if (activeBtn) activeBtn.classList.add('active');
        }

        function applyFontSize(sizePx) {
            document.body.style.fontSize = sizePx + 'px';
            document.getElementById('font-size-display').innerText = sizePx + 'px';
            localStorage.setItem('novel_font_size', sizePx);
        }

        // Reading Progress & Scroll Position
        const SCROLL_STORAGE_KEY = `scroll_pos_${NOVEL_ID}_${CHAPTER_NUM}`;

        function restoreScrollPosition() {
            const savedY = localStorage.getItem(SCROLL_STORAGE_KEY);
            if (savedY) {
                window.scrollTo({ top: parseInt(savedY, 10), behavior: 'instant' });
            }
        }

        let scrollTimeout = null;
        window.addEventListener('scroll', function() {
            if (scrollTimeout) clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(function() {
                localStorage.setItem(SCROLL_STORAGE_KEY, window.scrollY);
            }, 150);
        });

        // Touch Swipe Navigation
        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        window.addEventListener('touchend', function(e) {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) > 80 && Math.abs(diffX) > Math.abs(diffY) * 1.6) {
                if (diffX > 0) {
                    const prevBtn = document.getElementById('prev-link');
                    if (prevBtn && !prevBtn.classList.contains('disabled')) prevBtn.click();
                } else {
                    const nextBtn = document.getElementById('next-link');
                    if (nextBtn && !nextBtn.classList.contains('disabled')) nextBtn.click();
                }
            }
        }, { passive: true });

        (function bootReader() {
            const theme = localStorage.getItem('novel_theme') || 'oled';
            const font = localStorage.getItem('novel_font') || 'Cairo';
            const size = localStorage.getItem('novel_font_size') || '19';

            applyTheme(theme);
            applyFont(font);
            applyFontSize(size);
            document.getElementById('slider-size').value = size;

            // Save last read pointer for the library card
            localStorage.setItem('last_read_' + NOVEL_ID, CHAPTER_NUM);

            window.addEventListener('load', function() {
                setTimeout(restoreScrollPosition, 50);
            });
        })();
    </script>
</body>
</html>
